# ============================================================================
# 【other_factors 家族】因子统计（归档 2026-10-08）
# ----------------------------------------------------------------------------
# 因子总数: 2 | warehouse 无缓存待计算: 2
# 暂存规则: 计算缓存就绪后按 category 归档至对应家族文件
# 家族口径: 暂存区 | warehouse 无缓存待计算或待归类因子
# 排列规则: 因子按 category 分组排列，组内按名称排序；条目间空 1 行
# ============================================================================
name: other_factors
version: '4.0'
strategy_type: other_factors 因子合集
author: Quant
updated_at: '2026-10-08'
description: 暂存区：warehouse 无缓存（待计算）或未归入五大家族的因子。计算缓存就绪后按 category 归档至对应家族文件。
analysis:
  pros: 保证五大家族文件与 warehouse 一一对应；新因子缓冲区。
  cons: 长期滞留会弱化家族化纪律。
  optimization_direction: 定期计算缓存并归档清零。
factors:
- name: KLOW2
  category: 量价形态
  expression:
    qlib: (Less($open, $close)-$low)/($high-$low+1e-12)
    duckdb: DuckDB暂未实现完整的Alpha158对应逻辑
  meaning: '【核心含义】

    K线下影线占全天振幅比例：下影线长度在全天振幅中的占比，值越大说明下方支撑越强，空头杀跌失败。


    【运行原理】

    形态截取：获取当日的收盘价(close)和最低价(low)；

    下影线（或实体下部）计算：计算两者之间的绝对差值，代表价格从日内低点被拉回（或砸下）的空间；

    比例换算：将该差值除以当日开盘价(open)进行标准化；

    支撑测试：该指标用于刻画下方买盘的承接力度，数值越大说明日内探底回升的动作越明显。'
  usage_scenario: 日内微观结构分析、短期反转与动量捕获。适合中高频策略的特征输入。
  strategy_hint: 此类因子捕捉了日内的多空博弈。例如长下影线（KLOW2）在连续下跌后常暗示反转；长上影线（KUP2）在高位暗示抛压。树模型能很好地利用其非线性特征。

- name: KUP2
  category: 量价形态
  expression:
    qlib: ($high-Greater($open, $close))/($high-$low+1e-12)
    duckdb: DuckDB暂未实现完整的Alpha158对应逻辑
  meaning: '【核心含义】

    K线上影线占全天振幅比例：上影线长度在全天振幅中的占比，值越大说明上方抛压越重，多头遇阻回落。


    【运行原理】

    形态截取：获取单日的最高价(high)与收盘价(close)；

    上影线（或实体上部）计算：计算最高价与收盘价之差，代表多头冲高后被空头打压回落的空间；

    比例换算：将回落空间除以当日开盘价(open)进行标准化；

    抛压测试：数值越大，说明日内冲高回落的阻力越强，上方套牢盘或抛压越重。'
  usage_scenario: 日内微观结构分析、短期反转与动量捕获。适合中高频策略的特征输入。
  strategy_hint: 此类因子捕捉了日内的多空博弈。例如长下影线（KLOW2）在连续下跌后常暗示反转；长上影线（KUP2）在高位暗示抛压。树模型能很好地利用其非线性特征。
