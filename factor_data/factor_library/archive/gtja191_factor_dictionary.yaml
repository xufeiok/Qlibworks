        s2 AS (SELECT *, CAST((f1 - LAG(f1, 4) OVER (PARTITION BY ts_code ORDER BY trade_date)) AS DOUBLE) AS f2 FROM s1),
        s3 AS (SELECT *, CAST(RANK() OVER (PARTITION BY trade_date ORDER BY SIGN(f2)) AS DOUBLE) AS f3 FROM s2)
