name: gtja191_factor_dictionary
version: '1.0'
strategy_type: 国泰君安191 Alpha因子集
author: Quant
updated_at: '2026-04-04'
description: 国泰君安191个短周期量价特征因子，广泛应用于高频和中高频量化交易中。该因子集基于量价特征挖掘短周期的反转与动量效应。
analysis:
  pros: 因子数量庞大且覆盖多种量价逻辑（动量、反转、量价相关性等），非常适合作为机器学习模型的输入池，挖掘非线性关系。
  cons: 由于全部为量价因子，同质化较高，且在不同市场环境下的衰减较快；部分公式极度复杂，计算开销较大。
  optimization_direction: 可结合 master_factor_dictionary 中的基本面因子进行正交化处理；利用特征选择算法（如Lasso、树模型特征重要性）剔除冗余因子。
factors:
  - name: Alpha1
    category: 量价综合 (Price-Volume Synthetic)
    expression:
      qlib: (-1 * Corr(Rank(Delta(Log($volume),1)),Rank((($close-$open)/$open)),6))
      duckdb: |-
        WITH s1 AS (SELECT *, CAST(LN(NULLIF(volume, 0)) AS DOUBLE) AS f1 FROM _raw),
        s2 AS (SELECT *, CAST((f1 - LAG(f1, 1) OVER (PARTITION BY ts_code ORDER BY trade_date)) AS DOUBLE) AS f2 FROM s1),
        s3 AS (SELECT *, CAST(RANK() OVER (PARTITION BY trade_date ORDER BY f2) AS DOUBLE) AS f3 FROM s2),
        s4 AS (SELECT *, CAST(RANK() OVER (PARTITION BY trade_date ORDER BY ((close - open) / NULLIF(open, 0))) AS DOUBLE) AS f4 FROM s3),
        s5 AS (SELECT *, CAST(CORR(f3, f4) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 5 PRECEDING AND CURRENT ROW) AS DOUBLE) AS f5 FROM s4)
        SELECT ts_code, trade_date, CAST(((-1) * f5) AS DOUBLE) AS value
        FROM s5
        WHERE ts_code IS NOT NULL AND trade_date IS NOT NULL
    meaning: |-
      【原始公式】
      (-1 * CORR(RANK(DELTA(LOG(VOLUME),1)),RANK(((CLOSE-OPEN)/OPEN)),6)

      【核心含义】
      国泰君安191因子体系中的 Alpha1 因子。具体业务含义参考原始研报公式解析。
    usage_scenario: 短周期多空博弈、量价背离与动量反转。
    strategy_hint: 高频与中频量价特征。建议作为 LightGBM / CatBoost 等树模型的特征集。
  - name: Alpha2
    category: 量价综合 (Price-Volume Synthetic)
    expression:
      qlib: -1 * Delta(((($close-$low)-($high-$close))/(($high-$low)),1))
      duckdb: |-
        WITH s1 AS (SELECT *, CAST((((close - low) - (high - close)) / NULLIF((high - low), 0)) AS DOUBLE) AS f1 FROM _raw),
        s2 AS (SELECT *, CAST((f1 - LAG(f1, 1) OVER (PARTITION BY ts_code ORDER BY trade_date)) AS DOUBLE) AS f2 FROM s1)
        SELECT ts_code, trade_date, CAST(((-1) * f2) AS DOUBLE) AS value
        FROM s2
        WHERE ts_code IS NOT NULL AND trade_date IS NOT NULL
    meaning: |-
      【原始公式】
      -1 * delta((((close-low)-(high-close))/((high-low)),1))

      【核心含义】
      国泰君安191因子体系中的 Alpha2 因子。具体业务含义参考原始研报公式解析。
    usage_scenario: 短周期多空博弈、量价背离与动量反转。
    strategy_hint: 高频与中频量价特征。建议作为 LightGBM / CatBoost 等树模型的特征集。
  - name: Alpha3
    category: 量价综合 (Price-Volume Synthetic)
    expression:
      qlib: Sum(If($close == Ref($close,1), 0, If($close > Ref($close,1), $close - Less($low, Ref($close,1)), $close - Greater($high, Ref($close,1)))), 6)
      duckdb: |-
        WITH s1 AS (SELECT *, CAST(LAG(close, 1) OVER (PARTITION BY ts_code ORDER BY trade_date) AS DOUBLE) AS f1 FROM _raw),
        s2 AS (SELECT *, CAST(CASE WHEN (close = f1) THEN 0 ELSE CASE WHEN (close > f1) THEN (close - LEAST(low, f1)) ELSE (close - GREATEST(high, f1)) END END AS DOUBLE) AS f2 FROM s1),
        s3 AS (SELECT *, CAST(SUM(f2) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 5 PRECEDING AND CURRENT ROW) AS DOUBLE) AS f3 FROM s2)
        SELECT ts_code, trade_date, CAST(f3 AS DOUBLE) AS value
        FROM s3
        WHERE ts_code IS NOT NULL AND trade_date IS NOT NULL
    meaning: |-
      【原始公式】
      SUM((CLOSE=DELAY(CLOSE,1)?0:CLOSE-(CLOSE>DELAY(CLOSE,1)?MIN(LOW,DELAY(CLOSE,1)):MAX(HIGH,DELAY(CLOSE,1)))),6)

      【核心含义】
      国泰君安191因子体系中的 Alpha3 因子。具体业务含义参考原始研报公式解析。
    usage_scenario: 短周期多空博弈、量价背离与动量反转。
    strategy_hint: 高频与中频量价特征。建议作为 LightGBM / CatBoost 等树模型的特征集。
  - name: Alpha4
    category: 量价综合 (Price-Volume Synthetic)
    expression:
      qlib: If((((Sum($close,8)/8)+Std($close,8))<(Sum($close,2)/2)), (-1*1), If(((Sum($close,2)/2)<((Sum($close,8)/8)-Std($close,8))), 1, If(((1<($volume/Mean($volume,20))) | (($volume/Mean($volume,20))==1)), 1, (-1*1))))
      duckdb: |-
        WITH s1 AS (SELECT *, CAST(SUM(close) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 7 PRECEDING AND CURRENT ROW) AS DOUBLE) AS f1 FROM _raw),
        s2 AS (SELECT *, CAST(STDDEV_SAMP(close) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 7 PRECEDING AND CURRENT ROW) AS DOUBLE) AS f2 FROM s1),
        s3 AS (SELECT *, CAST(SUM(close) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS DOUBLE) AS f3 FROM s2),
        s4 AS (SELECT *, CAST(AVG(volume) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 19 PRECEDING AND CURRENT ROW) AS DOUBLE) AS f4 FROM s3)
        SELECT ts_code, trade_date, CAST(CASE WHEN (((f1 / NULLIF(8, 0)) + f2) < (f3 / NULLIF(2, 0))) THEN ((-1) * 1) ELSE CASE WHEN ((f3 / NULLIF(2, 0)) < ((f1 / NULLIF(8, 0)) - f2)) THEN 1 ELSE CASE WHEN ((1 < (volume / NULLIF(f4, 0))) OR ((volume / NULLIF(f4, 0)) = 1)) THEN 1 ELSE ((-1) * 1) END END END AS DOUBLE) AS value
        FROM s4
        WHERE ts_code IS NOT NULL AND trade_date IS NOT NULL
    meaning: |-
      【原始公式】
      ((((SUM(CLOSE,8)/8)+STD(CLOSE,8))<(SUM(CLOSE,2)/2))?(-1*1):(((SUM(CLOSE,2)/2)<((SUM(CLOSE,8)/8)-STD(CLOSE,8)))?1:(((1<(VOLUME/MEAN(VOLUME,20)))||((VOLUME/MEAN(VOLUME,20))==1))?1:(-1*1))))

      【核心含义】
      国泰君安191因子体系中的 Alpha4 因子。具体业务含义参考原始研报公式解析。
    usage_scenario: 短周期多空博弈、量价背离与动量反转。
    strategy_hint: 高频与中频量价特征。建议作为 LightGBM / CatBoost 等树模型的特征集。
  - name: Alpha5
    category: 量价综合 (Price-Volume Synthetic)
    expression:
      qlib: (-1*Ts_Max(Corr(Ts_Rank($volume,5),Ts_Rank($high,5),5),3))
      duckdb: |-
        WITH s1 AS (SELECT *, CAST((LEN(list_filter(list(volume) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 4 PRECEDING AND CURRENT ROW), v -> v IS NOT NULL AND v <= volume))::DOUBLE / 5) AS DOUBLE) AS f1 FROM _raw),
        s2 AS (SELECT *, CAST((LEN(list_filter(list(high) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 4 PRECEDING AND CURRENT ROW), v -> v IS NOT NULL AND v <= high))::DOUBLE / 5) AS DOUBLE) AS f2 FROM s1),
        s3 AS (SELECT *, CAST(CORR(f1, f2) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 4 PRECEDING AND CURRENT ROW) AS DOUBLE) AS f3 FROM s2),
        s4 AS (SELECT *, CAST(MAX(f3) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS DOUBLE) AS f4 FROM s3)
        SELECT ts_code, trade_date, CAST(((-1) * f4) AS DOUBLE) AS value
        FROM s4
        WHERE ts_code IS NOT NULL AND trade_date IS NOT NULL
    meaning: |-
      【原始公式】
      (-1*TSMAX(CORR(TSRANK(VOLUME,5),YSRANK(HIGH,5),5),3))

      【核心含义】
      国泰君安191因子体系中的 Alpha5 因子。具体业务含义参考原始研报公式解析。
