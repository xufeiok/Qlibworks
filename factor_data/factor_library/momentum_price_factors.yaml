- name: CNTD10
  category: 滚动统计
  expression:
    qlib: Mean($close>Ref($close, 1), 10)-Mean($close<Ref($close, 1), 10)
    duckdb: DuckDB暂未实现完整的Alpha158对应逻辑
  meaning: '【核心含义】

    涨跌天数差值 (Count Difference)：过去10天中上涨天数与下跌天数占比的差值。直接反映多空天数力量对比。


    【运行原理】

    涨跌识别：逐日对比过去N天的收盘价与前一交易日收盘价，分别标记为上涨日和下跌日；

    频率统计：在设定窗口内，分别计算上涨日出现的平均概率（多头占比）和下跌日出现的平均概率（空头占比）；

