    duckdb: "WITH ret AS (\n  SELECT ts_code, trade_date,\n         close / LAG(close, 5) OVER (PARTITION BY ts_code ORDER BY trade_date) - 1 AS ret_5d\n  FROM _raw\n)\nSELECT ts_code, trade_date, -1 * LAG(ret_5d, 1) OVER (PARTITION BY ts_code ORDER BY trade_date) AS value FROM ret\n"
  logic:
