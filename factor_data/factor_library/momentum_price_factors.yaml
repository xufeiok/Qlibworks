name: momentum_price_factors
version: '1.0'
strategy_type: momentum_price_factors 因子合集
author: Quant
updated_at: '2026-10-26'
description: Momentum&Price 量价趋势家族：动量与反转（13）+ 量价形态（69，含 GTJA191 补齐 12 个；KUP2/KLOW2 未入档）+ 滚动统计（145）。合并自 reversal_momentum/price_volume/rolling 三文件。
analysis:
  pros: A股月度动量弱短期反转强，同族质检；Alpha158 滚动统计与 GTJA191 形态因子统一归档。
  cons: 族大（215个）近亲多，依赖类内+全局双层去冗余；量价占比红线<=35%。
  optimization_direction: 按相关矩阵层次聚类精选簇代表；按拥挤度滚动淘汰失效因子。
factors:
- name: EXTREME_REV
  version: '1.0'
  category: 动量与反转
  sub_category: extreme
  expression:
    qlib: If(Abs($close / Ref($close, 1) - 1) > 0.095, ($close / Ref($close, 1) - 1) * (-1), 0)
    duckdb: CASE WHEN ABS((close - LAG(close) OVER (PARTITION BY ts_code ORDER BY trade_date)) / NULLIF(LAG(close) OVER (PARTITION BY ts_code ORDER BY trade_date), 0)) > 0.095 THEN -((close - LAG(close) OVER (PARTITION BY ts_code ORDER BY trade_date)) / NULLIF(LAG(close) OVER (PARTITION BY ts_code ORDER BY trade_date), 0)) ELSE 0 END
  logic:
    return_source: close
    theory: 涨停/跌停后的反转效应
    expected_direction: positive
  parameters:
    lookback: 1
    freq: daily
  data_source: qlib
  meaning: 当日涨跌幅超过9.5%时取反，否则为0
  ref: A股特有现象

- name: IND_NEUT_MOM
  version: '1.0'
  category: 动量与反转
  sub_category: industry_neutral
  expression:
    qlib: ($close / Ref($close, 126) - 1 - $sw_industry_mean_ret_126) / $sw_industry_std_ret_126
    duckdb: "WITH stock_ret AS (\n  SELECT r.ts_code, r.trade_date,\n         r.close / LAG(r.close, 126) OVER (PARTITION BY r.ts_code ORDER BY r.trade_date) - 1 AS ret_126d,\n         i.sw_l1\n  FROM _raw r\n  LEFT JOIN _sw_industry i ON r.ts_code = i.ts_code\n),\nind_stats AS (\n  SELECT trade_date, sw_l1,\n         AVG(ret_126d) AS ind_mean,\n         STDDEV_SAMP(ret_126d) AS ind_std\n  FROM stock_ret\n  WHERE sw_l1 IS NOT NULL AND ret_126d IS NOT NULL\n  GROUP BY trade_date, sw_l1\n)\nSELECT s.ts_code, s.trade_date,\n       (s.ret_126d - i.ind_mean) / NULLIF(i.ind_std, 0) AS value\nFROM stock_ret s\nLEFT JOIN ind_stats i ON s.trade_date = i.trade_date AND s.sw_l1 = i.sw_l1\nWHERE s.ret_126d IS NOT NULL AND i.ind_std IS NOT NULL AND i.ind_std > 0\n"
  logic:
    return_source: close
    theory: 行业内标准化后的动量得分
    expected_direction: positive
  parameters:
    lookback: 126
    freq: daily
  data_source: qlib
  meaning: 在申万一级行业内做Z-score标准化的6个月动量
  ref: Asness et al. (2013)

- name: LTR_12m
  version: '1.0'
  category: 动量与反转
  sub_category: long_term
  expression:
    qlib: Ref($close / Ref($close, 252) - 1, 20) * (-1)
    duckdb: "WITH ret AS (\n  SELECT ts_code, trade_date,\n         close / LAG(close, 252) OVER (PARTITION BY ts_code ORDER BY trade_date) - 1 AS ret_252d\n  FROM _raw\n)\nSELECT ts_code, trade_date, -1 * LAG(ret_252d, 20) OVER (PARTITION BY ts_code ORDER BY trade_date) AS value FROM ret\n"
  logic:
    return_source: close
    theory: 长期过度反应后的均值回归
    expected_direction: positive
  parameters:
    lookback: 252
    freq: daily
  data_source: qlib
  meaning: 过去1年收益率取负（跳过最近20天），捕捉长期反转效应
  ref: De Bondt & Thaler (1985)

- name: MOM_12m
  version: '1.0'
  category: 动量与反转
  sub_category: long_term
  expression:
    qlib: $close / Ref($close, 252) - 1
    duckdb: close / LAG(close, 252) OVER (PARTITION BY ts_code ORDER BY trade_date) - 1
  logic:
    return_source: close
    theory: 长期价格趋势延续
    expected_direction: positive
  parameters:
    lookback: 252
    freq: daily
  data_source: qlib
  meaning: 过去1年收益率，捕捉长期动量效应
  ref: Carhart (1997)

- name: MOM_6m
  version: '1.0'
