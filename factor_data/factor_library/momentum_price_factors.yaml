  meaning: '【核心含义】

    价格趋势决定系数 (R-square)：过去10天价格线性回归的R平方。衡量价格趋势的线性度（平滑度），值越大说明趋势越稳定。


    【运行原理】

    数据准备：以时间序列（1到N）作为自变量，N天内的收盘价作为因变量；

    线性拟合：进行普通最小二乘法(OLS)线性回归；

    判定系数计算：计算回归模型的决定系数 R-squared (R²)，即因变量的方差中可由自变量（时间趋势）解释的比例；

    趋势平稳度评估：R² 越接近1，说明价格沿直线涨跌的趋势越平稳、噪音越小；越接近0，说明走势杂乱无章、震荡剧烈。'
  usage_scenario: 刻画过去10天的趋势质量与波动风险。用于波动率控制和趋势平滑度筛选。
  strategy_hint: 低波动（STD小）、高线性度（RSQR大）的股票往往具有更好的上涨持续性；残差（RESI）过大往往意味着趋势即将破坏。

