- name: KUP
  category: 量价形态
  expression:
    qlib: ($high-Greater($open, $close))/$open
    duckdb: DuckDB暂未实现完整的Alpha158对应逻辑
  meaning: '【核心含义】

    K线上影线比例：衡量日内最高价到实体上边缘的距离，反映日内多头向上试探后被空头打压的程度。


    【运行原理】

    形态截取：获取单日的最高价(high)与收盘价(close)；

    上影线（或实体上部）计算：计算最高价与收盘价之差，代表多头冲高后被空头打压回落的空间；

    比例换算：将回落空间除以当日开盘价(open)进行标准化；

    抛压测试：数值越大，说明日内冲高回落的阻力越强，上方套牢盘或抛压越重。'
  usage_scenario: 日内微观结构分析、短期反转与动量捕获。适合中高频策略的特征输入。
  strategy_hint: 此类因子捕捉了日内的多空博弈。例如长下影线（KLOW2）在连续下跌后常暗示反转；长上影线（KUP2）在高位暗示抛压。树模型能很好地利用其非线性特征。

- name: LOW0
  category: 量价形态
  expression:
    qlib: $low/$close
    duckdb: DuckDB暂未实现完整的Alpha158对应逻辑
  meaning: '【核心含义】

    相对收盘的最低价：衡量今日最低价相对于最新收盘价的位置，反映日内低点反弹的幅度。


    【运行原理】

    数据截取：仅获取当前单个交易日的最低价(low)和收盘价(close)；

    相对换算：将当日最低价直接除以当日收盘价；

    折价刻画：结果必然小于或等于1，数值越小，说明日内曾经深度下探但最终被强力拉回，反映出下方承接盘的厚度（长下影线的变体表达）。'
  usage_scenario: 日内价格相对位置锚定。常用于刻画日内的超买超卖状态。
  strategy_hint: 主要作为基础刻画特征，VWAP0 能够很好地代表主力资金当天的平均建仓成本位置，配合次日表现可做动量判断。

- name: OPEN0
  category: 量价形态
  expression:
    qlib: $open/$close
    duckdb: DuckDB暂未实现完整的Alpha158对应逻辑
  meaning: '【核心含义】

    相对收盘的开盘价：衡量今日开盘价相对于最新收盘价的位置，反映隔夜跳空与日内波动的综合结果。


    【运行原理】

    数据截取：获取当前单个交易日的开盘价(open)和收盘价(close)；

    相对换算：将开盘价直接除以收盘价；

    日内演变：若大于1，说明高开低走（收阴）；若小于1，说明低开高走（收阳）。该值直观呈现了日内交易时段价格的整体漂移方向。'
  usage_scenario: 日内价格相对位置锚定。常用于刻画日内的超买超卖状态。
  strategy_hint: 主要作为基础刻画特征，VWAP0 能够很好地代表主力资金当天的平均建仓成本位置，配合次日表现可做动量判断。

- name: VWAP0
  category: 量价形态
  expression:
    qlib: $vwap/$close
    duckdb: vwap / close
  meaning: '【核心含义】

    相对收盘的均价：衡量全天成交均价相对于收盘价的位置，用于判断收盘价是高于还是低于全天平均成本。


    【运行原理】

    均价提取：获取当前交易日的成交量加权平均价(VWAP)，该价格代表了全天所有买卖单的真实平均建仓成本；

    收盘比对：获取当日的最终收盘价(close)；

    折溢价换算：将 VWAP 直接除以收盘价；

    日内盈亏评估：若结果大于1，说明收盘价跌破了全天均价，日内入场的大部分资金处于浮亏状态（偏空）；若小于1，则大部分资金实现浮盈（偏多）。'
  usage_scenario: 日内价格相对位置锚定。常用于刻画日内的超买超卖状态。
  strategy_hint: 主要作为基础刻画特征，VWAP0 能够很好地代表主力资金当天的平均建仓成本位置，配合次日表现可做动量判断。

- name: ma_cross_5_20
  category: 量价形态
  expression:
    qlib: Mean($close, 5) / Mean($close, 20) - 1
    duckdb: (avg(close) over (partition by ts_code order by trade_date rows between 4 preceding and current row)) / (avg(close) over (partition by ts_code order by trade_date rows between 19 preceding and current row)) - 1
  meaning: 5日均线与20日均线的偏离度（双均线交叉代理）。
  usage_scenario: 捕捉中短期趋势的启动点或衡量趋势的强度。
  strategy_hint: 经典 CTA 策略因子，也可用于股票多头策略的择时过滤。

- name: BETA10
  category: 滚动统计
  expression:
    qlib: Slope($close, 10)/$close
    duckdb: DuckDB暂未实现完整的Alpha158对应逻辑
  meaning: '【核心含义】

    价格趋势斜率 (Beta/Slope)：过去10天价格序列对时间的线性回归斜率。代表价格的上涨或下跌趋势强度。


    【运行原理】

    数据读取：按设定的时间窗口（如5天）提取标的资产的每日收盘价序列；

    线性拟合：将时间序列作为自变量，收盘价作为因变量，进行普通最小二乘法(OLS)线性回归；

    斜率提取：获取该回归方程的斜率(Slope)，代表资产价格随时间的平均绝对增长率；

    价格归一化：将提取出的斜率值除以当前的最新收盘价，将绝对变化率转化为无量纲的相对变化率，以消除不同高低价股位带来的尺度差异。'
  usage_scenario: 刻画过去10天的趋势质量与波动风险。用于波动率控制和趋势平滑度筛选。
  strategy_hint: 低波动（STD小）、高线性度（RSQR大）的股票往往具有更好的上涨持续性；残差（RESI）过大往往意味着趋势即将破坏。

