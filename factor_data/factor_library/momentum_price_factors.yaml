    duckdb: "WITH ret AS (\n  SELECT ts_code, trade_date,\n         close / LAG(close, 20) OVER (PARTITION BY ts_code ORDER BY trade_date) - 1 AS ret_20d\n  FROM _raw\n)\nSELECT ts_code, trade_date, -1 * LAG(ret_20d, 1) OVER (PARTITION BY ts_code ORDER BY trade_date) AS value FROM ret\n"
  logic:
    return_source: close
    theory: 短期过度反应后的均值回归
