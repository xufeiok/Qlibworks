- name: QTLD10
  category: 滚动统计
  expression:
    qlib: Quantile($close, 10, 0.2)/$close
    duckdb: DuckDB暂未实现完整的Alpha158对应逻辑
  meaning: '【核心含义】

    区间下分位数 (Quantile Down)：过去10天价格的20%分位数相对当前价格的比值。类似布林带下轨概念。


    【运行原理】

    分位数排序：在设定的N天时间窗口内，将所有交易日的收盘价从小到大进行排列；

    低位分位提取：提取位于 20% 分位点(0.2)的收盘价，作为该区间的“稳健支撑位”（剔除了极端的单日最低价干扰）；

    归一化处理：将该20%分位价格除以当前的最新收盘价；

    下行空间评估：用于衡量当前价格距离近期筹码低位密集区的距离，评估向下回调的潜在缓冲空间。'
  usage_scenario: 识别过去10天的支撑阻力位及超买超卖状态（如震荡市的区间交易）。
