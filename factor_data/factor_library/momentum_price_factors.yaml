- name: VOL_REV
  version: '1.0'
  category: 动量与反转
  sub_category: volatility
  expression:
    qlib: Ref(Std($close / Ref($close, 1) - 1, 60), 1) * (-1)
    duckdb: "WITH ret AS (\n  SELECT ts_code, trade_date,\n         (close - LAG(close) OVER (PARTITION BY ts_code ORDER BY trade_date)) / LAG(close) OVER (PARTITION BY ts_code ORDER BY trade_date) AS ret_1d\n  FROM _raw\n),\nvol AS (\n  SELECT ts_code, trade_date,\n         STDDEV_SAMP(ret_1d) OVER (PARTITION BY ts_code ORDER BY trade_date ROWS BETWEEN 59 PRECEDING AND CURRENT ROW) AS vol_60d\n  FROM ret\n)\nSELECT ts_code, trade_date, -1 * LAG(vol_60d, 1) OVER (PARTITION BY ts_code ORDER BY trade_date) AS value FROM vol\n"
  logic:
    return_source: close
    theory: 高波动率后的均值回归
    expected_direction: positive
  parameters:
    lookback: 60
    freq: daily
  data_source: qlib
  meaning: 过去60日收益率标准差取负，捕捉波动率反转效应
  ref: French et al. (1987)

- name: long_momentum
  category: 动量与反转
  expression:
    qlib: ($close - Ref($close, 60)) / Ref($close, 60)
    duckdb: (close - lag(close, 60) over (partition by ts_code order by trade_date)) / lag(close, 60) over (partition by ts_code order by trade_date)
  meaning: 60日收益率。中期动量因子，筛选出中期处于上升通道的股票。
  usage_scenario: 趋势跟随策略的基础池筛选。
  strategy_hint: 正向因子，大前提是股票处于中期上升趋势中，然后再利用短期反转寻找上车点。

- name: momentum_1m
  category: 动量与反转
  expression:
    qlib: ($close - Ref($close, 20)) / Ref($close, 20)
    duckdb: (close - lag(close, 20) over (partition by ts_code order by trade_date)) / lag(close, 20) over (partition by ts_code order by trade_date)
  meaning: 过去20个交易日的收益率（月度动量）。
  usage_scenario: 适合中高频选股策略。A股存在短期的反转效应和中长期的动量效应。
  strategy_hint: 通常与基本面因子结合，作为趋势跟随策略的核心因子。

- name: short_reversal
  category: 动量与反转
  expression:
