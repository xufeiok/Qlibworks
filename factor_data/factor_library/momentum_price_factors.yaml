- name: MA10
  category: 滚动统计
  expression:
    qlib: Mean($close, 10)/$close
    duckdb: DuckDB暂未实现完整的Alpha158对应逻辑
  meaning: '【核心含义】

    移动平均 (Moving Average)：过去10天的价格移动平均相对当前价格的比值。反映短期均线乖离率，常用于均线回归或趋势判断。


    【运行原理】

    窗口聚合：在设定的N天时间窗口内，收集每一天的收盘价；

    均值计算：对窗口内的所有收盘价求简单算术平均数(Mean)，得到该周期的移动平均线点位；

    乖离率换算：将计算出的移动平均值除以当前的最新收盘价；

    偏离度评估：结果大于1代表价格跌破均线（超卖或下行），小于1代表价格在均线上方（超买或上行），反映了短期价格相对均值中枢的偏离状态。'
  usage_scenario: 捕捉过去10天的动量与均线乖离。
  strategy_hint: 短期（如5天、10天）常表现为反转特征（均值回归），中长期（如20天、60天）常表现为动量特征（趋势延续）。线性模型中需注意方向反转，非线性模型会自动切分阈值。

