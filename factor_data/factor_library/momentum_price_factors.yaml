- name: VSTD10
  category: 滚动统计
  expression:
    qlib: Std($volume, 10)/($volume+1e-12)
    duckdb: DuckDB暂未实现完整的Alpha158对应逻辑
  meaning: '【核心含义】

    成交量波动率 (Volume STD)：过去10天成交量的相对标准差。衡量交投活跃度的稳定性。


