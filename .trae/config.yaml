# Trae IDE 项目配置
# 用于配置 AI 助手的默认行为和偏好设置

# 是否自动加载 .claude 目录中的规则和技能
autoLoad:
  enabled: true
  rulesDirectory: .claude/rules
  skillsDirectory: .claude/skills

# 默认工作流模式
workflow:
  mode: "cautious"  # "cautious" 或 "aggressive"
  # cautious: 优先检查技能和规则，确保符合项目规范
  # aggressive: 更快速响应，仅在必要时检查规则

# 技能优先级
skillPriority:
  - quant-all-star-team
  - publish-to-wechat
  - skill-creator
  - docx
  - pdf
  - xlsx
  - frontend-design
  - workflow-orchestrator

# 规则应用策略
ruleApplication:
  # 是否在执行任务前自动检索项目规则
  checkProjectRules: true
  # 是否检查技能目录
  checkSkills: true
  # 项目规则文件路径
  projectRulesFile: .claude/rules/project-coding-rules.md

# 语言设置
language:
  default: "zh-CN"
  codeComments: "zh-CN"

# 代码规范
coding:
  # 是否强制使用中文注释
  forceChineseComments: true
  # 函数/模块大小限制
  maxFunctionLines: 50
  # 依赖管理
  dependencyPolicy: "review-first"  # "review-first" 或 "allow-list"

# 验证要求
validation:
  # 是否在交付前强制运行测试
  requireTests: true
  # 是否检查语法错误
  checkSyntax: true
  # 是否检查技术债务
  checkTechDebt: true

# 交付要求
delivery:
  # 是否需要变更日志
  requireChangelog: false
  # 是否需要验收报告
  requireAcceptanceReport: true
  # 中文输出要求
  outputInChinese: true
